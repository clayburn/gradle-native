plugins {
	id 'dev.gradleplugins.java-gradle-plugin'
	id 'dev.gradleplugins.gradle-plugin-unit-test'
}

gradlePlugin {
	plugins {
		buildScan {
			id = 'nokeebuild.build-scan'
			implementationClass = 'nokeebuild.buildscan.BuildScanPlugin'
		}
	}

	dependencies {
		compileOnly 'com.gradle:develocity-gradle-plugin'
	}
}

test {
	dependencies {
		implementation 'com.gradle:develocity-gradle-plugin:4.4.3'
	}
}
